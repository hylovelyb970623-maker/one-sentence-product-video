name: Verify source and privacy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python scripts/security_check.py --git --history
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r m0/requirements-dev.txt
      - run: python -m pytest m0/tests -q
      - run: python -m pip_audit -r m0/requirements.txt
      - run: python scripts/package_release.py --output release/verified-source.zip
