name: Verify source and privacy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python scripts/security_check.py --git --history
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r m0/requirements-dev.txt
      - run: python -m pytest m0/tests -q
      - run: python -m pip_audit -r m0/requirements.txt
      - run: python scripts/package_release.py --output release/verified-source.zip
