<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作控制台 · 本地管理</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#172033;--muted:#687386;--line:#e4e8f0;--blue:#3568f5;--green:#159570;--amber:#b97812;--red:#c44242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,select{font:inherit}button{border:0;border-radius:8px;cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:236px;background:#16213a;color:#dce5ff;padding:28px 18px;flex:none}.brand{font-weight:750;font-size:18px;padding:0 12px 34px}.brand small{display:block;color:#91a1c5;font-size:11px;font-weight:400;margin-top:4px}.nav{padding:11px 12px;border-radius:8px;background:#2a3c67;color:#fff}.content{flex:1;min-width:0}.top{height:76px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top h1{font-size:20px;margin:0}.quiet{color:var(--muted);font-size:12px}.wrap{max-width:1440px;margin:auto;padding:30px 34px}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.intro h2{margin:0 0 5px;font-size:24px}.intro p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:17px 20px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:5px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar label{color:var(--muted)}select{background:#fff;border:1px solid var(--line);padding:8px 30px 8px 10px;border-radius:7px;color:var(--ink)}.grid{display:grid;grid-template-columns:minmax(370px,1fr) minmax(420px,1.25fr);gap:18px}.panel{overflow:hidden}.panel-title{padding:17px 20px;border-bottom:1px solid var(--line);font-weight:700}.job{padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}.job:hover,.job:focus{background:#f5f7ff}.job.selected{border-left:3px solid var(--blue);padding-left:17px;background:#f1f4ff}.job[aria-selected="true"]{box-shadow:inset 0 0 0 1px rgba(53,104,245,.18)}.job:focus-visible{outline:3px solid #aebfff;outline-offset:-3px}.job-head,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.job-id{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:12px;color:var(--muted)}.pill{padding:3px 9px;border-radius:99px;font-size:12px;background:#edf0f5;color:var(--muted);white-space:nowrap}.pill.good{color:var(--green);background:#e8f7f1}.pill.warn{color:var(--amber);background:#fff5df}.pill.bad{color:var(--red);background:#ffeded}.bar{height:6px;background:#edf0f5;border-radius:5px;margin-top:13px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:5px}.detail{padding:20px}.detail h3{margin:0 0 4px;font-size:18px}.section{margin-top:22px}.section h4{margin:0 0 8px;font-size:13px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f8fb;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;font:12px/1.65 ui-monospace,SFMono-Regular,monospace;max-height:260px;overflow:auto}.timeline{border-left:2px solid #dce3f5;margin:8px 0 0 6px;padding-left:17px}.event{position:relative;margin:0 0 13px}.event:before{content:"";position:absolute;left:-24px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--blue)}.event b{font-size:12px}.event p{margin:2px 0;color:var(--muted);font-size:12px}.action{margin-top:18px;background:var(--blue);color:#fff;padding:10px 15px;font-weight:650}.action:focus,.job:focus,select:focus{outline:3px solid #aebfff;outline-offset:2px}.notice{margin:0 0 18px;padding:12px 15px;border-radius:8px;background:#fff5df;color:#80580e}.error{color:var(--red);background:#fff0f0}.empty{padding:45px 20px;text-align:center;color:var(--muted)}@media(max-width:850px){.side{display:none}.wrap{padding:22px 16px}.top{padding:0 16px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.intro{display:block}.intro .quiet{display:block;margin-top:10px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand">本地制作控制台<small>AI Director · Admin</small></div><div class="nav" aria-current="page">任务监控</div></aside><div class="content"><header class="top"><h1>任务监控</h1><span class="quiet" id="updated">正在连接</span></header><main class="wrap"><div class="intro"><div><h2>制作任务</h2><p>查看真实任务状态、提示词与阶段记录</p></div><span class="quiet">每 5 秒自动刷新</span></div><p class="notice">中断任务不会自动重新提交，也不会取消远端工作。“确认远端已结束”仅在远端队列为空时解除阻塞，不恢复原任务、不自动消费 GPU。</p><div id="notice" role="alert" hidden></div><section class="stats" aria-label="任务统计"><div class="stat"><span>全部任务</span><strong id="total">—</strong></div><div class="stat"><span>制作中</span><strong id="active">—</strong></div><div class="stat"><span>已完成</span><strong id="done">—</strong></div><div class="stat"><span>需关注</span><strong id="attention">—</strong></div></section><div class="toolbar"><label for="filter">筛选任务</label><select id="filter"><option value="all">全部状态</option><option value="active">制作中</option><option value="planning">策划中</option><option value="done">已完成</option><option value="attention">需关注</option><option value="error">失败</option></select></div><div class="grid"><section class="panel" aria-labelledby="jobsTitle"><div id="jobsTitle" class="panel-title">任务列表</div><div id="jobs" role="listbox" aria-label="制作任务" aria-live="polite"></div></section><section class="panel" aria-labelledby="detailTitle"><div id="detailTitle" class="panel-title">任务详情</div><div id="detail" class="empty">选择左侧任务查看详情</div></section></div></main></div></div>
<script>
const state={jobs:[],selected:null,loaded:false,busy:false,resolving:false};const $=id=>document.getElementById(id);const active=['queued','planning','generating','rendering'];
const labels={queued:'排队中',planning:'策划中',generating:'生成中',rendering:'合成中',done:'已完成',attention:'需关注',error:'失败'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(t){return t?new Date(t*1000).toLocaleString('zh-CN',{hour12:false}):'—'}function cls(s){return s==='done'?'good':s==='attention'?'warn':s==='error'?'bad':''}
function render(){const focused=document.activeElement;const focusId=focused?.dataset?.id;const resolveFocused=focused?.id==='resolve';let f=$('filter').value, list=state.jobs.filter(j=>f==='all'||(f==='active'?active.includes(j.stage):j.stage===f));$('total').textContent=state.jobs.length;$('active').textContent=state.jobs.filter(j=>active.includes(j.stage)).length;$('done').textContent=state.jobs.filter(j=>j.stage==='done').length;$('attention').textContent=state.jobs.filter(j=>j.stage==='attention').length;$('jobs').innerHTML=list.length?list.map(j=>`<div class="job ${state.selected===j.job_id?'selected':''}" tabindex="0" role="option" aria-selected="${state.selected===j.job_id?'true':'false'}" data-id="${esc(j.job_id)}"><div class="job-head"><span class="job-id">${esc(j.job_id)}</span><span class="pill ${cls(j.stage)}">${labels[j.stage]||esc(j.stage)}</span></div><div class="row"><span class="time">${esc(j.message||'暂无消息')}</span><span class="time">${Number(j.progress||0)}%</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(j.progress)||0))}%"></i></div></div>`).join(''):'<div class="empty">暂无符合条件的任务</div>';document.querySelectorAll('.job').forEach(el=>{el.onclick=()=>select(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el.dataset.id)}}});if(state.selected&&!state.jobs.some(j=>j.job_id===state.selected))state.selected=null;detail();if(focusId){const el=Array.from(document.querySelectorAll('.job')).find(el=>el.dataset.id===focusId);if(el)el.focus({preventScroll:true});else $('filter').focus({preventScroll:true})}if(resolveFocused){($('resolve')||$('filter')).focus({preventScroll:true})}}
function select(id){state.selected=id;render()}function detail(){let j=state.jobs.find(x=>x.job_id===state.selected);if(!j){$('detail').className='empty';$('detail').textContent='选择左侧任务查看详情';return}$('detail').className='detail';let shots=(j.shots||[]).map(s=>`<div class="section"><h4>镜头 ${s.index+1} · ${esc(s.status||'—')} · 远端 ID ${esc(s.prompt_id||'未提交')}</h4><pre>${esc(s.prompt||'暂无提示词')}</pre></div>`).join('');$('detail').innerHTML=`<h3>${esc(j.job_id)}</h3><div class="row"><span class="pill ${cls(j.stage)}">${labels[j.stage]||esc(j.stage)}</span>${j.persona?'<span class="pill">指定人物形象</span>':''}<span class="time">创建于 ${fmt(j.created_at)}</span></div><p>${esc(j.message||'')}</p>${j.diagnostic?`<div class="section"><h4>错误诊断</h4><pre class="error">${esc(j.diagnostic)}</pre></div>`:''}${shots}<div class="section"><h4>阶段记录</h4><div class="timeline"><div class="event"><b>任务创建</b><p>${fmt(j.created_at)} · 已持久化真实任务</p></div><div class="event"><b>当前阶段：${labels[j.stage]||esc(j.stage)}</b><p>最后保存 ${fmt(j.updated_at)} · ${esc(j.message||'')}</p><p>仅展示已记录的时间与当前状态，不推算历史阶段。</p></div></div></div>${j.stage==='attention'?'<button class="action" id="resolve">确认远端已结束</button>':''}`;let b=$('resolve');if(b)b.onclick=resolve}
async function request(url,options={}){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timeout)}}
async function refresh(){if(state.busy||state.resolving)return;state.busy=true;try{let r=await request('/api/admin/jobs',{cache:'no-store'});if(!r.ok)throw Error(r.status===401?'认证失效，请刷新页面重新登录':'服务暂时不可用（HTTP '+r.status+'）');const jobs=await r.json();if(!Array.isArray(jobs)||jobs.some(j=>!j||typeof j.job_id!=='string'||(j.shots&&!Array.isArray(j.shots))))throw Error('任务数据格式异常');const changed=JSON.stringify(jobs)!==JSON.stringify(state.jobs)||!state.loaded;state.jobs=jobs;state.loaded=true;$('notice').hidden=true;$('updated').textContent='最后更新 '+new Date().toLocaleTimeString('zh-CN');if(changed)render()}catch(e){$('notice').textContent=(e.name==='AbortError'?'请求超时，请稍后重试':e.message)+(state.loaded?'；以下保留上次成功读取的数据。':'');$('notice').className='notice error';$('notice').hidden=false;$('updated').textContent='连接失败';if(!state.loaded)$('jobs').innerHTML='<div class="empty">未能加载任务，5 秒后自动重试。<br>认证失效时请刷新页面。</div>'}finally{state.busy=false}}
async function resolve(){if(state.resolving)return;if(!window.confirm('仅在远端队列为空时解除阻塞，不取消远端工作、不恢复或重新提交任务。确认检查远端是否已结束？'))return;const id=state.selected;state.resolving=true;let b=$('resolve');b.disabled=true;try{let r=await request('/api/admin/jobs/'+encodeURIComponent(id)+'/resolve',{method:'POST'});if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.detail||'确认失败（HTTP '+r.status+'）')}state.resolving=false;await refresh()}catch(e){$('notice').textContent=e.name==='AbortError'?'确认请求超时，结果未知；请等待状态刷新，不要重复操作。':e.message;$('notice').className='notice error';$('notice').hidden=false}finally{state.resolving=false;if($('resolve'))$('resolve').disabled=false}}$('filter').onchange=render;$('jobs').innerHTML='<div class="empty">正在读取真实任务…</div>';refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script></body></html>
